[project]
name = "vitaldb-bench"
version = "0.0.1"
description = "VitalDB timing and data-quality audit: device clock drift, numeric delays, derived labels and TimeNet builds"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrew J. Goodwin" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "timenet>=0.11", "timenet-connectors>=0.11"]

[project.optional-dependencies]
# the analysis scripts in tools/ (not part of the installed package)
tools = ["scipy>=1.10", "pandas", "matplotlib", "pyarrow", "physiosync", "lineaccess", "neurokit2", "biosppy",
         "duckdb", "cairosvg"]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vitaldb_bench"]

[tool.ruff]
line-length = 120
extend-exclude = ["tools/adhoc"]   # provenance scripts kept as written (see tools/adhoc/README.md)

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D"]   # pyflakes, imports and Google docstrings (ruff 0.17 defaults are broader)
ignore = ["D105", "D107", "EXE002"]   # EXE002: the Windows-mounted files look executable

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"tools/**" = ["D", "E701", "E702", "E731", "E741", "I001"]   # analysis scripts: compact style, module docstrings only

[tool.pytest.ini_options]
testpaths = ["tests"]   # tools/adhoc holds scripts whose names end in _test.py; they are not tests
