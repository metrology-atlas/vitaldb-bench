[project]
site_name = "vitaldb-bench"
site_description = "VitalDB timing and data-quality audit: clock drift, numeric delays, derived labels and resumable TimeNet builds."
use_directory_urls = false
repo_url = "https://github.com/meshlab/vitaldb-bench"
repo_name = "meshlab/vitaldb-bench"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
copyright = "© 2026 Andrew J. Goodwin, University of Sydney · MIT licence"

nav = [
  { "Home" = "index.md" },
  { "Get started" = "get-started.md" },
  { "How-to guides" = [{ "Build TimeNet" = "how-to/build-timenet.md" }, { "Read corrected times" = "how-to/corrected-times.md" }, { "Check fidelity" = "how-to/check-fidelity.md" }, { "Benchmark builds" = "how-to/benchmark.md" }, { "Recover the case clock" = "how-to/case-clock.md" }, { "Timing budget" = "how-to/timing-budget.md" }, { "Reproduce the results" = "how-to/reproduce-results.md" }] },
  { "Concepts" = [{ "Availability" = "concepts/availability.md" }, { "Timing modes" = "concepts/timing-modes.md" }, { "Data sharing and licensing" = "concepts/data-and-licensing.md" }] },
  { "Reference" = [{ "API reference" = "reference/index.md" }, { "Analysis scripts" = "reference/tools.md" }] },
]

[project.theme]
features = ["navigation.instant", "navigation.tabs", "navigation.sections", "navigation.top", "navigation.indexes", "toc.follow", "content.code.copy", "search.highlight", "search.suggest"]

[project.theme.icon]
repo = "fontawesome/brands/github"
logo = "lucide/clock"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon-star"
toggle.name = "Switch to light mode"

[project.extra]
generator = false

[project.plugins.search]

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
show_root_heading = true
show_symbol_type_toc = true
show_if_no_docstring = false
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
members_order = "source"
filters = ["!^_"]

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.toc]
permalink = true

[project.plugins.mkdocstrings.handlers.python.options.docstring_options]
warn_missing_types = false        # command functions take argparse namespaces; types are described in prose
